name: Test Branch

on:
  push:
    branches: [ main ]
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # https://github.com/actions/checkout/releases
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # https://github.com/jdx/mise-action/releases
      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0

      # https://github.com/actions/setup-go/releases
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          check-latest: true
          go-version-file: 'go.mod'

      - name: Setup golangci-lint cache
        # https://github.com/actions/cache/releases
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/golangci-lint
          key: ${{ runner.os }}-golangci-lint-${{ hashFiles('**/go.mod') }}
          restore-keys: |
            ${{ runner.os }}-golangci-lint-

      - name: Run tidy
        run: make tidy && git diff --exit-code

      - name: Run generate
        run: make generate && make fmt && git diff --exit-code

      - name: Run lint
        run: make lint

      - name: Run test
        run: make test

      # https://github.com/codecov/codecov-action/releases
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        if: success() && github.ref == 'refs/heads/main'
        with:
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.out

  kind:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      # https://github.com/actions/checkout/releases
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # https://github.com/jdx/mise-action/releases
      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0

      # https://github.com/actions/setup-go/releases
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          check-latest: true
          go-version-file: 'go.mod'

      - name: Build example image
        run: docker build -f example/Dockerfile -t foomo-gateway-example:test .

      - name: Create kind cluster
        # https://github.com/helm/kind-action/releases
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: foomo-gateway
          config: test/kind/kind-config.yaml

      - name: Load image into kind
        run: kind load docker-image foomo-gateway-example:test --name=foomo-gateway

      - name: Apply CRD + manifests
        run: |
          kubectl apply -f config/crd/foomo.org_gateways.yaml
          kubectl wait --for=condition=Established crd/gateways.foomo.org --timeout=30s
          kubectl apply -f test/kind/manifests/
          kubectl -n default wait --for=condition=Available --timeout=120s \
            deployment/contentserver deployment/pagefrontend \
            deployment/newsfrontend deployment/errorfrontend

      - name: Run kind tests
        env:
          GO_TEST_TAGS: integration
        run: go test -C test/kind -tags=safe -count=1 ./...
