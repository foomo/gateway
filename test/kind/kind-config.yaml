kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
# extraPortMappings expose the four backend NodePort Services on localhost so the
# in-process gateway under test (running on the host) can proxy to them.
nodes:
  - role: control-plane
    extraPortMappings:
      - { containerPort: 30001, hostPort: 30001, protocol: TCP }  # contentserver
      - { containerPort: 30002, hostPort: 30002, protocol: TCP }  # page frontend
      - { containerPort: 30003, hostPort: 30003, protocol: TCP }  # news frontend
      - { containerPort: 30004, hostPort: 30004, protocol: TCP }  # error frontend
