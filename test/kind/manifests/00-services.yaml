# Four backend services, each running a binary baked into foomo-gateway-example:test.
# Each Service is type: NodePort on a fixed port that the kind cluster has mapped to
# the host via extraPortMappings (see ../kind-config.yaml).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: contentserver
  labels:
    app.kubernetes.io/part-of: foomo-gateway-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: contentserver
  template:
    metadata:
      labels:
        app: contentserver
        app.kubernetes.io/part-of: foomo-gateway-test
    spec:
      containers:
        - name: contentserver
          image: foomo-gateway-example:test
          imagePullPolicy: IfNotPresent
          command: ["/contentserver"]
          args: ["--addr=:8080"]
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: contentserver
spec:
  type: NodePort
  selector:
    app: contentserver
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30001
